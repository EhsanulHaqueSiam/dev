# autosubsync-mpv configuration
# Requires `ffsubsync` (preferred, fast) or `alass` installed on the system.
# Install: yay -S ffsubsync OR pipx install ffsubsync OR yay -S alass

# Absolute paths — .desktop launches don't always have mise shims on PATH.
ffmpeg_path=/usr/bin/ffmpeg
ffsubsync_path=/home/siam/.local/share/mise/shims/ffsubsync
alass_path=

# Which tool to use: ffsubsync | alass | ask
# `ask` shows a picker each time. ffsubsync is the modern default.
audio_subsync_tool=ffsubsync
altsub_subsync_tool=ffsubsync

# When yes, the synced file overwrites the original instead of saving alongside.
unload_old_sub=no
