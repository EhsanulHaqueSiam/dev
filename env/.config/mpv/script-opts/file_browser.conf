# mpv-file-browser configuration
# Full option list: https://github.com/CogentRedTester/mpv-file-browser/blob/master/docs/options.md

# Directory to use as Home (`HOME` keybind). Comma-separated list of roots.
root=~/Videos,~/Downloads,~/Music,~/

# Number of entries visible at once
num_entries=22

# Wrap cursor around top/bottom of list
wrap=yes

# Highlight the entry that's currently playing, follow it through navigation
cursor_follows_playing_item=yes

# Cache directory listings (faster reopens of same dir)
cache=yes

# Start in the directory of the currently-playing file (rather than last-opened)
default_to_working_directory=yes

# Don't autoload sibling files via file-browser — autoload.lua handles that
autoload=no

# Filter dotfiles/dotdirs by default; toggle with `.` inside the browser
filter_dot_files=auto
filter_dot_dirs=auto
