### FIXED - Arch Linux + RTX 4060 Mobile + i7-13700H ###

# Video Output - Enhanced for RTX 4060 Mobile
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
hwdec=nvdec-copy
hwdec-codecs=all
profile=gpu-hq
vd-lavc-dr=yes
opengl-pbo=yes

# Window Settings
force-window=yes
keep-open=yes
border=yes

# High-Quality Video Processing - Enhanced
video-sync=display-resample
interpolation=yes
# Keep interpolation permanently on. Without this, libplacebo briefly measures a
# 0.0 frame ratio at startup, disables interpolation, then re-enables it a few
# frames in — that on->off->on reconfigure is the one black flicker right after
# a video starts. -1 disables the auto-toggle so it never flips.
interpolation-threshold=-1
tscale=mitchell
scale=ewa_lanczossharp
scale-antiring=0.7
cscale=ewa_lanczos
cscale-antiring=0.9
dscale=lanczos
dscale-antiring=0.8
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
deband=yes
deband-iterations=3
deband-threshold=32
deband-range=24
deband-grain=8
temporal-dither=yes
dither-depth=auto

# Optimized Cache for 16GB RAM - Enhanced
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=150MiB
demuxer-readahead-secs=45
cache-secs=20
demuxer-seekable-cache=yes
# cache-pause-initial=yes froze the first frames waiting for cache on open (a
# visible hitch/flash for local files). Local playback doesn't need it.
cache-pause-initial=no

# Enhanced Audio Settings - PipeWire optimized
audio-device=auto
audio-exclusive=no
volume=70
volume-max=150
audio-pitch-correction=yes
audio-channels=stereo,5.1,7.1
audio-buffer=0.15
audio-stream-silence=yes
audio-wait-open=2.0

# Language Preferences
alang=ja,jp,jpn,japanese,en,eng,english
slang=en,eng,english,ja,jp,jpn,japanese

# Subtitle Settings
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:Subs:Subtitles
audio-file-auto=fuzzy
sub-fix-timing=yes
blend-subtitles=yes
sub-ass-override=force
demuxer-mkv-subtitle-preroll=yes

# Power Management & Battery Optimization
# battery-profile option doesn't exist, using conditional profiles instead

# IPC & Interface
input-ipc-server=/tmp/mpv-socket
osc=no
osd-bar=no
border=yes
force-window=yes
idle=yes
# Hide cursor + uosc UI after 1s of mouse inactivity (uosc autohide=yes follows this)
cursor-autohide=1000

# File Management
keep-open=yes
save-position-on-quit=yes
watch-later-dir="~~/cache/watch_later"
gpu-shader-cache-dir="~~/cache/shaders_cache"

# Screenshot Settings
screenshot-format=png
screenshot-png-compression=8
screenshot-directory="~/Pictures/mpv-screenshots"
# Filename: "MovieName - 01.23.45.678 (frame 0001).png"
screenshot-template="%F - %P (frame %04n)"
# Capture exactly what the VO renders (post-shader, post-OSD if used)
screenshot-sw=no

### Profile Includes ###
include="~~/profiles.conf"

### Subtitle Styling - Clean & Modern ###
sub-font="Noto Sans"
sub-font-size=52
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2.4
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
sub-margin-x=25
sub-margin-y=50
sub-scale=0.9

### OSD Styling ###
osd-font="JetBrains Mono"
osd-font-size=32
osd-color="#FFFFFF"
osd-border-color="#000000"
osd-border-size=1.5
osd-shadow-offset=1
osd-shadow-color="#33000000"
osd-spacing=0.25
osd-margin-x=25
osd-margin-y=25

### Audio Enhancement (Toggle with 'a' key) ###
# Simple volume normalization for laptop speakers
af-toggle=@normalize:dynaudnorm=g=5:f=250:r=0.9:p=0.5

# Key bindings are now in input.conf file
### Performance Optimizations ###
# Threading and processing
vd-lavc-threads=0
ad-lavc-threads=4
vd-lavc-assume-old-x264=no

# Memory and I/O optimizations
stream-buffer-size=4MiB
network-timeout=60
user-agent="mpv/0.40.0"

# Display optimizations
# display-fps-override removed — let the 165Hz panel drive timing
# video-timing-offset removed — modern Wayland/mpv handles A/V sync

# Subtitle optimizations
sub-gauss=0.6
sub-gray=yes
sub-fix-timing=yes
blend-subtitles=video

# Advanced video processing
# video-output-levels=auto: let mpv match the source range (full/limited).
# Forcing =full washed out limited-range SDR on start.
video-output-levels=auto
# target-colorspace-hint enabled ONLY in the [HDR] profile (profiles.conf).
# Setting it globally made the compositor switch colorspace on every SDR
# video open -> the one-time flash/blink. gpu-next handles SDR fine without it.
target-colorspace-hint=no
# icc-profile-auto disabled - compositor doesn't support ICC profiles

# Network streaming optimizations
hls-bitrate=max
ytdl-format=bestvideo[height<=?1440]+bestaudio/best

### Conditional Optimizations ###
# Enable Vulkan for specific profiles only
[Vulkan-Mode]
profile-desc=Vulkan mode for maximum performance
gpu-api=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=2

# Auto-applied when fullscreen is on. Reverts on exit.
# Drops the heaviest filters because cross-GPU dmabuf to a 2560x1600 iGPU
# scanout doesn't have the frame budget for interpolation + ewa scalers.
[fullscreen-perf]
profile-cond=fullscreen
profile-restore=copy
interpolation=no
scale=spline36
cscale=spline36
dscale=mitchell
deband-iterations=1
deband-grain=4