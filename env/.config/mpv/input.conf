### Clean & User-Friendly MPV Input Configuration ###

# Basic Controls
SPACE           cycle pause
q               quit
Q               quit-watch-later
ESC             set fullscreen no
f               cycle fullscreen

# Volume Controls (Laptop-Friendly)
UP              add volume 2
DOWN            add volume -2
WHEEL_UP        add volume 2
WHEEL_DOWN      add volume -2
m               cycle mute

# Seeking (Simple & Predictable)
LEFT            seek -5
RIGHT           seek 5
Shift+LEFT      seek -60
Shift+RIGHT     seek 60
,               frame-back-step
.               frame-step

# Playback Speed (Clear Controls)
[               multiply speed 0.9091    # Decrease speed
]               multiply speed 1.1       # Increase speed
{               multiply speed 0.5       # Half speed
}               multiply speed 2.0       # Double speed
BS              set speed 1.0           # Reset to normal speed

# Subtitle Controls
v               cycle sub-visibility
b               cycle sub
n               cycle audio
V               cycle sub-ass-override
z               add sub-delay -0.1
x               add sub-delay 0.1
ALT+j           add sub-scale +0.05
ALT+k           add sub-scale -0.05

# Audio Controls
a               af toggle @normalize
F1              af toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]"
CTRL+a          cycle audio-normalize-downmix

# Video Enhancement
d               cycle deband
i               cycle interpolation
c               cycle-values video-sync "display-resample" "audio" "desync"
CTRL+h          cycle-values hwdec "nvdec-copy" "vaapi-copy" "auto" "no"

# Screenshots
s               screenshot
S               screenshot video
CTRL+s          screenshot window

# Profile Switching (F-Keys for Easy Access)
F2              apply-profile Battery-Saver
F3              apply-profile High-Performance  
F4              apply-profile Ultra-Quality
F5              apply-profile Anime-Ultra

# Shader Profiles (CTRL+Number) — content-type-organized lineup
# Live-action presets: 1=Hollywood, 2=Bollywood, 3=Web Series/TV
CTRL+1          apply-profile Movie-Quality;     show-text "Hollywood / Premium Movie — SSim + CAS"
CTRL+2          apply-profile Bollywood-Quality; show-text "Bollywood / Indian — denoise + chroma + CAS"
CTRL+3          apply-profile Stream-Quality;    show-text "Web Series / TV — denoise + sharpen"
# Anime presets: 4=standard, 5=HQ, 6=Anime4K CNN L
CTRL+4          apply-profile Anime4K-Mode-A;    show-text "Anime4K v4 Mode A"
CTRL+5          apply-profile Anime4K-Mode-A-HQ; show-text "Anime4K v4 Mode A (HQ)"
CTRL+6          apply-profile Ani4k;             show-text "Anime4K CNN L (modern anime)"
# Generic upscalers: 7=NNEDI3, 8=RAVU, 9=FSR
CTRL+7          apply-profile NNEDI3+;           show-text "NNEDI3 (high quality)"
CTRL+8          apply-profile Ravu-Zoom;         show-text "RAVU-Zoom (fast)"
CTRL+9          apply-profile FSR;               show-text "FSR (battery-friendly)"
CTRL+0          no-osd set glsl-shaders "";      show-text "Shaders: Cleared"

# Auto Profiles (ALT+F-Keys)
ALT+F1          apply-profile Live-Action-HD
ALT+F2          apply-profile Live-Action-SD
ALT+F3          apply-profile Anime-HD
ALT+F4          apply-profile Anime-SD
ALT+F5          apply-profile Streaming

# Advanced Performance Toggles
CTRL+v          apply-profile Vulkan-Mode
CTRL+g          cycle-values gpu-api "opengl" "vulkan"
CTRL+p          cycle-values vo "gpu-next" "gpu" "wlshm"

# Touchpad/Mouse Support
AXIS_UP         add volume 1
AXIS_DOWN       add volume -1
AXIS_LEFT       seek -2
AXIS_RIGHT      seek 2
### UOSC Integration & Advanced Features ###

# Mouse & UI Controls
MBTN_LEFT       cycle pause; script-message-to uosc flash-pause-indicator
MBTN_RIGHT      script-binding uosc/menu
TAB             script-message-to uosc toggle-ui

# Playlist Navigation
;               playlist-prev
'               playlist-next

# UOSC Menu Shortcuts
menu            script-binding uosc/menu
ALT+o           script-message-to uosc show-submenu-blurred "Open"
ALT+z           script-message-to uosc show-submenu-blurred "Audio"
ALT+x           script-message-to uosc show-submenu-blurred "Subtitles"

# File Operations
CTRL+o          script-binding uosc/open-file
y               script-binding uosc/load-subtitles
Y               script-binding uosc/subtitles
CTRL+l          script-binding uosc/load-subtitles

# Script Bindings
h               script-binding memo-history
# p key freed up — webtorrent script never installed
# Reusing for `playlist-info` toggle via uosc:
p               script-binding uosc/playlist
CTRL+d          script-binding autodeint/autodeint
ALT+b           script-binding uosc/download-subtitles
/               script-binding console/enable

# Playlist (playlistmanager)
P               script-binding playlistmanager/showplaylist
CTRL+P          script-binding playlistmanager/saveplaylist
ALT+l           script-binding playlistmanager/loadfiles

# File browser (mpv-file-browser)
e               script-binding file_browser/browse-files

# Subtitle download via uosc (OpenSubtitles search)
CTRL+SHIFT+s    script-binding uosc/download-subtitles

# Open URL (paste-and-play; useful for YouTube etc.)
CTRL+u          script-binding uosc/open-url

# Stream quality picker (active for online streams)
CTRL+SHIFT+q    script-binding uosc/stream-quality

# Audio output device picker
CTRL+SHIFT+a    script-binding uosc/audio-device

# Delete current file to trash (uses gio trash)
DEL             script-binding uosc/delete-file-next
SHIFT+DEL       script-binding uosc/delete-file-quit

# Auto-sync subtitle timing (autosubsync-mpv)
# Requires ffsubsync or alass installed (yay -S ffsubsync alass)
CTRL+SHIFT+t    script-binding autosubsync-menu

# Manual reload current file/stream (mpv-reload also auto-reloads stalled streams)
CTRL+r          script-binding reload/reload_resume

# Advanced Video Filters
ALT+v           vf toggle deblock=filter=weak:block=4
ALT+d           cycle deband

# Individual Shader Toggles (for advanced users)
SHIFT+1         change-list glsl-shaders toggle ~~/shaders/F8.glsl
SHIFT+2         change-list glsl-shaders toggle ~~/shaders/nnedi3_nns32_win8x4.glsl
SHIFT+3         change-list glsl-shaders toggle ~~/shaders/ravu_z_ar_r3.glsl
SHIFT+4         change-list glsl-shaders toggle ~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl
SHIFT+5         change-list glsl-shaders toggle ~~/shaders/nlmeans_luma.glsl; show-text "NLMeans denoise toggled"
# (clear-all-shaders lives on CTRL+0; `c` restored to video-sync cycle, `n` to audio-track cycle)

# Window Management
ALT+m           cycle window-minimized

### UOSC Menu Definitions ###
# Lines prefixed with `#` are uosc menu-only entries (no keybind).
# Lines starting with a real key are both a binding AND a menu entry.

# Open submenu
# script-binding uosc/open-file               #! Open > Open File
# script-binding uosc/open-url                #! Open > Open URL / Paste from clipboard
# script-binding file_browser/browse-files    #! Open > File Browser
# script-binding uosc/playlist                #! Open > Playlist
# script-binding uosc/chapters                #! Open > Chapters
# script-binding uosc/editions                #! Open > Editions
# script-binding uosc/stream-quality          #! Open > Stream Quality
# script-binding memo-history                 #! Open > Recently Played

# Playlist submenu (playlistmanager)
# script-binding playlistmanager/showplaylist     #! Playlist > Show Playlist
# script-binding playlistmanager/loadfiles        #! Playlist > Load Files from Directory
# script-binding playlistmanager/saveplaylist     #! Playlist > Save Playlist
# script-binding playlistmanager/shuffleplaylist  #! Playlist > Shuffle
# script-binding playlistmanager/sortplaylist     #! Playlist > Sort by Next Mode
# script-binding playlistmanager/reverseplaylist  #! Playlist > Reverse

# Video submenu
# script-binding uosc/video                                                       #! Video > Select Video Track
# cycle interpolation                                                             #! Video > Toggle Interpolation
# apply-profile Deband-Medium                                                     #! Video > Filters > Deband (Medium)
# apply-profile Deband-Strong                                                     #! Video > Filters > Deband (Strong)
# vf toggle deblock=filter=weak:block=4                                           #! Video > Filters > Toggle Deblocking
# change-list glsl-shaders toggle ~~/shaders/nlmeans_luma.glsl                    #! Video > Shaders > Denoise
# apply-profile Movie-Quality       #! Video > Profiles > Hollywood / Premium Movie
# apply-profile Bollywood-Quality   #! Video > Profiles > Bollywood / Indian Film
# apply-profile Stream-Quality      #! Video > Profiles > Web Series / TV Show
# apply-profile FSRCNNX             #! Video > Profiles > Live-Action HD (FSRCNNX)
# apply-profile FSRCNNX+            #! Video > Profiles > Live-Action SD (FSRCNNX+)
# apply-profile NNEDI3              #! Video > Profiles > NNEDI3 (general)
# apply-profile NNEDI3+             #! Video > Profiles > NNEDI3+ (high quality)
# apply-profile Ravu-Zoom           #! Video > Profiles > RAVU-Zoom (fast)
# apply-profile FSR                 #! Video > Profiles > FSR (battery-friendly)
# apply-profile Anime4K-Mode-A      #! Video > Profiles > Anime4K v4 Mode A
# apply-profile Anime4K-Mode-A-HQ   #! Video > Profiles > Anime4K v4 Mode A (HQ)
# apply-profile Anime4K-Mode-A+A    #! Video > Profiles > Anime4K v4 Mode A+A (low-quality source)
# apply-profile Ani4k               #! Video > Profiles > Anime4K CNN L (modern anime HD)
# apply-profile AniSD               #! Video > Profiles > Anime4K CNN L (modern anime SD)
