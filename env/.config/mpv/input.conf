# Audio submenu
# script-binding uosc/audio                                                       #! Audio > Select Audio Track
# script-binding uosc/audio-device                                                #! Audio > Output Device
# af toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]"                                  #! Audio > Dialogue Enhancement

# Subtitles submenu
# script-binding uosc/load-subtitles      #! Subtitles > Load from File
# script-binding uosc/download-subtitles  #! Subtitles > Download (OpenSubtitles)
# script-binding autosubsync-menu         #! Subtitles > Auto-sync Timing
# script-binding uosc/subtitles           #! Subtitles > Select Track
# add sub-scale +0.05                     #! Subtitles > Bigger
# add sub-scale -0.05                     #! Subtitles > Smaller
