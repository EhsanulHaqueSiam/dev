profile-desc=Auto 4K downscaling for RTX 4060 Mobile — light high-quality dscale + big cache
# get(...,0) avoids "compare number with nil" errors when height/width are unset (idle/init).
profile-cond=(get("height", 0) >= 2160 or get("width", 0) >= 3840)
profile-restore=copy-equal
hwdec=nvdec-copy
# Light, shader-free downscale (mitchell + ewa). For a sharper perceptual
# downscale on demand, apply the ssimds shader via a shader hotkey.
